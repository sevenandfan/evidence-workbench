name: offline regression

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install pinned runtime and data readers
        run: |
          python -m pip install --only-binary=:all: -r requirements-lock.txt
          python -m pip install -r requirements-data.txt
      - name: Acquire pinned public research sources
        run: |
          python scripts/acquire_manylabs.py
          python scripts/prepare_manylabs.py
          python scripts/acquire_participants.py
          python scripts/acquire_site_labels.py
      - name: Acquire and prepare UCI Online Retail
        run: |
          python scripts/acquire_retail.py
          python scripts/prepare_retail.py
      - name: Run complete offline regression
        run: python scripts/evaluate.py
      - name: Verify representative workflows
        run: |
          python -m b1 demo
          python -m b1 replicate
          python scripts/audit_site_identity.py
          python -m b1 end-to-end
          python -m b1 retail
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: evidence-workbench-results
          path: |
            evals/regression-results.json
            runs/
          retention-days: 7
